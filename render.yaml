services:
  - type: web
    name: cyberaware-cameroon
    runtime: python
    plan: free
    region: frankfurt
    rootDir: rag_pipeline
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_API_KEY
        sync: false
